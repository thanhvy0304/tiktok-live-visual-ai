name: Top Host Capture Plan - DRY RUN
on:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  capture-plan:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: projects/291478497469/locations/global/workloadIdentityPools/top-host-github/providers/github-actions
          service_account: top-host-schedule-reader@olala-live-together.iam.gserviceaccount.com
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install Google auth
        run: python -m pip install --disable-pip-version-check google-auth requests
      - name: Run offline safety tests
        run: python -m unittest top_host.test_capture_plan_dry_run -v
      - name: Read schedule
        run: python top_host/schedule_sync_json.py
      - name: Validate handoff
        run: python top_host/capture_handoff_preview.py
      - name: Generate non-capturing plan
        run: python top_host/capture_plan_dry_run.py
      - name: Upload capture plan
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: top-host-capture-plan-dry-run
          path: top_host/output/capture_plan_dry_run.json
          if-no-files-found: warn
          retention-days: 7
