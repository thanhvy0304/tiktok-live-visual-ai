name: Top Host E2E Integration - DRY RUN
on:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: top-host-e2e-dry-run
  cancel-in-progress: false

jobs:
  e2e-dry-run:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: projects/291478497469/locations/global/workloadIdentityPools/top-host-github/providers/github-actions
          service_account: top-host-schedule-reader@olala-live-together.iam.gserviceaccount.com
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install read-only Google auth
        run: python -m pip install --disable-pip-version-check google-auth requests
      - name: Test integrated safety gates
        run: |
          python -m unittest top_host.test_e2e_dry_run -v
          python -m unittest top_host.test_capture_plan_dry_run top_host.test_dedup_gate_dry_run top_host.test_capture_ledger_adapter top_host.test_review_approval_gate -v
      - name: Read today's Top Host schedule
        run: python top_host/schedule_sync_json.py
      - name: Validate capture handoff
        run: python top_host/capture_handoff_preview.py
      - name: End-to-end non-capturing report
        run: python -m top_host.e2e_dry_run
      - name: Upload E2E diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: top-host-e2e-dry-run
          path: top_host/output/e2e_dry_run.json
          if-no-files-found: warn
          retention-days: 7
