
name: Test Live Image Capture

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  capture-and-upload:
    runs-on: ubuntu-latest
    timeout-minutes: 12

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install playwright pillow requests
          python -m playwright install --with-deps chromium

      - name: Capture TikTok LIVE
        run: |
          python screenshot.py

      - name: Prepare and upload image
        env:
          VISUAL_API_URL: ${{ secrets.VISUAL_API_URL }}
          VISUAL_API_TOKEN: ${{ secrets.VISUAL_API_TOKEN }}
        run: |
          python - <<'PY'
          import os
          import io
          import json
          import base64
          import requests
          from pathlib import Path
          from PIL import Image

          api_url = os.environ.get("VISUAL_API_URL", "").strip()
          api_token = os.environ.get("VISUAL_API_TOKEN", "").strip()

          if not api_url or not api_token:
              raise RuntimeError("Missing API URL or Token")

          candidates = []
          for folder in ("screenshots", "visual_captures"):
              path = Path(folder)
              if path.exists():
                  candidates.extend(path.rglob("*.png"))

          if not candidates:
              raise RuntimeError("No screenshot PNG found")

          latest = max(
              candidates,
              key=lambda p: p.stat().st_mtime
          )

          print("Screenshot found:", latest.name)

          with Image.open(latest) as image:
              image = image.convert("RGB")

              if image.width > 1600:
                  height = round(
                      image.height * 1600 / image.width
                  )
                  image = image.resize((1600, height))

              buffer = io.BytesIO()
              image.save(
                  buffer,
                  format="PNG",
                  optimize=True
              )

              png_bytes = buffer.getvalue()

          if len(png_bytes) > 2 * 1024 * 1024:
              raise RuntimeError(
                  "PNG exceeds 2 MB test API limit"
              )

          print("Image size:", len(png_bytes), "bytes")

          payload = {
              "token": api_token,
              "action": "test_upload",
              "image_base64": base64.b64encode(
                  png_bytes
              ).decode("ascii")
          }

          print("Sending image to Apps Script...")

          response = requests.post(
              api_url,
              json=payload,
              timeout=150,
              allow_redirects=True
          )

          response.raise_for_status()

          try:
              result = response.json()
          except ValueError:
              print(
                  "API returned non-JSON response:",
                  response.text[:300]
              )
              raise RuntimeError("Invalid API response")

          if (
              result.get("ok") is not True
              or result.get("status") != "TEST_UPLOAD_SUCCESS"
          ):
              print(
                  "API error:",
                  result.get("error", "Unknown error")
              )
              raise RuntimeError("Test upload failed")

          print("TEST UPLOAD SUCCESS")
          print("File:", result.get("file_name"))
          print("Size:", result.get("size_bytes"))
          print("Image URL:", result.get("image_url"))
          PY
