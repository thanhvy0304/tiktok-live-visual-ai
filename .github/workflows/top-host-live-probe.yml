name: Top Host LIVE Probe - READ ONLY
on:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  live-probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: projects/291478497469/locations/global/workloadIdentityPools/top-host-github/providers/github-actions
          service_account: top-host-schedule-reader@olala-live-together.iam.gserviceaccount.com
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: |
          python -m pip install --disable-pip-version-check google-auth requests playwright
          python -m playwright install --with-deps chromium
      - name: Read Top Host schedule
        run: python top_host/schedule_sync_json.py
      - name: Validate schedule handoff
        run: python top_host/capture_handoff_preview.py
      - name: Probe LIVE playback without recording
        run: python top_host/live_probe.py
      - name: Upload read-only diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: top-host-live-probe
          path: top_host/output/*.json
          if-no-files-found: warn
          retention-days: 7
