name: Top Host Review Approval Gate - OFFLINE TEST
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: top-host-review-approval-gate
  cancel-in-progress: false

jobs:
  approval-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Validate approval rules offline
        run: |
          python -m unittest top_host.test_review_approval_gate -v
          python -m unittest top_host.test_capture_ledger_adapter -v
