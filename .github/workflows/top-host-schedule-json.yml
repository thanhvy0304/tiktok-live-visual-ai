name: Top Host Schedule JSON - READ ONLY
on:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  top-host-schedule-json:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: projects/291478497469/locations/global/workloadIdentityPools/top-host-github/providers/github-actions
          service_account: top-host-schedule-reader@olala-live-together.iam.gserviceaccount.com
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install --disable-pip-version-check google-auth requests
      - name: Export Top Host schedule JSON (no writes)
        run: python top_host/schedule_sync_json.py
      - name: Upload JSON artifact
        uses: actions/upload-artifact@v4
        with:
          name: top-host-schedule-json
          path: top_host/output/schedule_sync.json
          if-no-files-found: error
          retention-days: 7
