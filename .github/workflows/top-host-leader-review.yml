name: Top Host Frame Evidence - MANUAL REVIEW
on:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  leader-review-frame:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: projects/291478497469/locations/global/workloadIdentityPools/top-host-github/providers/github-actions
          service_account: top-host-schedule-reader@olala-live-together.iam.gserviceaccount.com
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install browser
        run: |
          python -m pip install --disable-pip-version-check google-auth requests playwright
          python -m playwright install --with-deps chromium
      - name: Read schedule
        run: python top_host/schedule_sync_json.py
      - name: Validate handoff
        run: python top_host/capture_handoff_preview.py
      - name: Single frame for manual identity review
        run: python top_host/leader_review_frame.py
      - name: Upload diagnostic evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: top-host-leader-review
          path: |
            top_host/output/leader_review.json
            top_host/output/leader_review_frame.png
          if-no-files-found: warn
          retention-days: 2
