name: Top Host Transition Decision - DRY RUN
on:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  transition-preview:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: projects/291478497469/locations/global/workloadIdentityPools/top-host-github/providers/github-actions
          service_account: top-host-schedule-reader@olala-live-together.iam.gserviceaccount.com
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install Sheets read dependency
        run: python -m pip install --disable-pip-version-check google-auth requests
      - name: Test transition rules
        run: python -m unittest top_host.test_transition_decision top_host.test_capture_lock_preview -v
      - name: Read schedule
        run: python top_host/schedule_sync_json.py
      - name: Validate handoff
        run: python top_host/capture_handoff_preview.py
      - name: Preview transition (no capture)
        run: python -m top_host.transition_decision
      - name: Simulate dedup lease (no writes)
        run: python -m top_host.capture_lock_preview
      - name: Upload decision
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: top-host-transition-decision
          path: |
            top_host/output/transition_decision.json
            top_host/output/lock_preview.json
          if-no-files-found: warn
          retention-days: 2
