name: Top Host Schedule Sync - DRY RUN
on:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  schedule-readonly:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: projects/291478497469/locations/global/workloadIdentityPools/top-host-github/providers/github-actions
          service_account: top-host-schedule-reader@olala-live-together.iam.gserviceaccount.com
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install --disable-pip-version-check google-auth requests
      - name: Read LIVE_SCHEDULE (dry run)
        run: python top_host/schedule_sync_dry_run.py
